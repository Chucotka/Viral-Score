<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viral Score</title>
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0A0A12;
            --bg-surface: #16152A;
            --accent: #7B2FFF;
            --text-main: #FFFFFF;
            --text-muted: #888899;
            --score-high: #00FF87;
            --score-medium: #FFD700;
            --score-low: #FF4757;
            --error: #FF4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.97);
        }

        /* Screens */
        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .screen.active {
            display: flex;
        }

        /* Main Screen */
        textarea {
            width: 100%;
            height: 180px;
            background-color: var(--bg-surface);
            border: 2px solid transparent;
            border-radius: 16px;
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            padding: 16px;
            resize: none;
            outline: none;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        textarea.error {
            border-color: var(--error);
        }

        .platform-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 32px;
        }

        .pill {
            background-color: var(--bg-surface);
            border: 1px solid transparent;
            color: var(--text-muted);
            border-radius: 20px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pill.active {
            background-color: rgba(123, 47, 255, 0.2);
            border-color: var(--accent);
            color: var(--text-main);
        }

        .pill:active {
            transform: scale(0.97);
        }

        .primary-btn {
            background: linear-gradient(135deg, #7B2FFF 0%, #A05CFF 100%);
            border: none;
            border-radius: 16px;
            color: white;
            font-family: inherit;
            font-size: 18px;
            font-weight: 700;
            padding: 18px;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .primary-btn:active {
            transform: scale(0.97);
        }

        .powered-by {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 16px;
        }

        /* Loading Screen */
        .loading-screen {
            justify-content: center;
            align-items: center;
        }

        .pulse-circle {
            width: 80px;
            height: 80px;
            background-color: var(--accent);
            border-radius: 50%;
            margin-bottom: 32px;
            animation: pulse 1.5s infinite;
        }

        .loading-text {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-main);
            text-align: center;
            height: 24px;
        }

        /* Results Screen */
        .gauge-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 32px;
        }

        .gauge-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .gauge-bg {
            fill: none;
            stroke: var(--bg-surface);
            stroke-width: 8;
        }

        .gauge-fill {
            fill: none;
            stroke: var(--accent); /* will be updated dynamically */
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            transition: stroke-dashoffset 1s ease-out;
        }

        .gauge-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .gauge-score {
            font-size: 48px;
            font-weight: 700;
            line-height: 1;
        }

        .gauge-label {
            font-size: 14px;
            font-weight: 500;
            margin-top: 4px;
        }

        .breakdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        /* The last item takes full width if odd number */
        .breakdown-grid > :last-child:nth-child(odd) {
            grid-column: 1 / -1;
        }

        .metric-card {
            background-color: var(--bg-surface);
            border-radius: 16px;
            padding: 16px;
            opacity: 0;
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .metric-bar-bg {
            height: 6px;
            background-color: var(--bg-main);
            border-radius: 3px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .metric-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--accent); /* dynamic */
            border-radius: 3px;
            transition: width 1s ease-out;
        }

        .metric-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .suggestions {
            background-color: var(--bg-surface);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
            opacity: 0;
        }

        .suggestions ul {
            list-style: none;
            padding-left: 0;
        }

        .suggestions li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .suggestions li:last-child {
            margin-bottom: 0;
        }

        .suggestions li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: bold;
        }

        .improved-version {
            background-color: var(--bg-surface);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
            position: relative;
            opacity: 0;
        }

        .improved-text {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 16px;
            white-space: pre-wrap;
        }

        .copy-btn {
            background-color: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            color: var(--text-main);
            padding: 8px 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s, transform 0.2s;
        }

        .copy-btn:active {
            transform: scale(0.97);
            background-color: rgba(255,255,255,0.2);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            opacity: 0;
            padding-bottom: 24px;
        }

        .secondary-btn {
            flex: 1;
            background-color: var(--bg-surface);
            border: none;
            border-radius: 16px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            text-align: center;
        }

        .secondary-btn:active {
            transform: scale(0.97);
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 10, 18, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-surface);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            background-color: var(--bg-main);
            border: 1px solid #333;
            border-radius: 12px;
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            padding: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        .modal-link {
            display: block;
            text-align: center;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            margin-top: 16px;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(123, 47, 255, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(123, 47, 255, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(123, 47, 255, 0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up {
            animation: fadeInUp 0.5s ease forwards;
        }

        /* Error Message inline */
        .error-message {
            color: var(--error);
            font-size: 14px;
            margin-top: 8px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>⚡ Viral Score</h1>
            <button class="icon-btn" id="settings-btn" aria-label="Settings">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </header>

        <!-- Main Screen -->
        <main id="main-screen" class="screen active">
            <textarea id="post-input" placeholder="Paste your hook, caption or post idea..."></textarea>

            <div class="platform-selector" id="platform-selector">
                <button class="pill active" data-platform="Instagram">Instagram</button>
                <button class="pill" data-platform="TikTok">TikTok</button>
                <button class="pill" data-platform="YouTube">YouTube</button>
                <button class="pill" data-platform="X">X</button>
                <button class="pill" data-platform="Telegram">Telegram</button>
            </div>

            <button class="primary-btn" id="analyze-btn">Analyze &rarr;</button>
            <div id="main-error" class="error-message"></div>
            <div class="powered-by">Powered by AI</div>
        </main>

        <!-- Loading Screen -->
        <div id="loading-screen" class="screen loading-screen">
            <div class="pulse-circle"></div>
            <div class="loading-text" id="loading-text">Analyzing hook strength...</div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="screen">
            <div class="gauge-container" style="--order: 0">
                <svg viewBox="0 0 100 100" class="gauge-svg">
                    <circle cx="50" cy="50" r="45" class="gauge-bg"></circle>
                    <circle cx="50" cy="50" r="45" class="gauge-fill" id="gauge-fill"></circle>
                </svg>
                <div class="gauge-text">
                    <div class="gauge-score" id="viral-score">0</div>
                    <div class="gauge-label" id="viral-label">Score</div>
                </div>
            </div>

            <div class="breakdown-grid" id="breakdown-grid">
                <!-- Metric cards will be injected here -->
            </div>

            <div class="section-title fade-in-up" style="animation-delay: 600ms;">Top Suggestions</div>
            <div class="suggestions fade-in-up" style="animation-delay: 700ms;">
                <ul id="suggestions-list">
                    <!-- Suggestions will be injected here -->
                </ul>
            </div>

            <div class="section-title fade-in-up" style="animation-delay: 800ms;">Improved Version</div>
            <div class="improved-version fade-in-up" style="animation-delay: 900ms;">
                <div class="improved-text" id="improved-text"></div>
                <button class="copy-btn" id="copy-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    Copy
                </button>
            </div>

            <div class="action-buttons fade-in-up" style="animation-delay: 1000ms;">
                <button class="secondary-btn" id="analyze-again-btn">Analyze Again</button>
                <button class="secondary-btn" style="background-color: rgba(123, 47, 255, 0.1); color: var(--accent);" id="share-btn">Share Result</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content">
            <button class="modal-close" id="close-settings-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="modal-title">⚙️ Settings</div>
            <div class="modal-desc">Add your OpenAI API key to power the analysis. Your key is stored securely on your device.</div>

            <div class="input-group">
                <label for="api-key-input">OpenAI API Key</label>
                <input type="password" id="api-key-input" placeholder="sk-...">
            </div>

            <button class="primary-btn" id="save-key-btn">Save Key</button>

            <a href="https://platform.openai.com/api-keys" target="_blank" class="modal-link">Get API key at platform.openai.com</a>
        </div>
    </div>

    <script>
        // JS logic

        // DOM Elements
        const screens = {
            main: document.getElementById('main-screen'),
            loading: document.getElementById('loading-screen'),
            results: document.getElementById('results-screen')
        };

        const settingsModal = document.getElementById('settings-modal');
        const settingsBtn = document.getElementById('settings-btn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn') || document.getElementById('close-settings-btn');
        const apiKeyInput = document.getElementById('api-key-input');
        const saveKeyBtn = document.getElementById('save-key-btn');
        const mainError = document.getElementById('main-error');

        const postInput = document.getElementById('post-input');
        const platformPills = document.querySelectorAll('.pill');
        const analyzeBtn = document.getElementById('analyze-btn');
        const analyzeAgainBtn = document.getElementById('analyze-again-btn');

        // State
        let currentPlatform = 'Instagram';
        let apiKey = localStorage.getItem('openai_api_key') || '';
        let lastAnalysisResult = null;

        // Initialize Telegram WebApp
        let tg = null;
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
        }

        // --- Settings Modal Logic ---
        function openSettings() {
            apiKeyInput.value = apiKey;
            settingsModal.classList.add('active');
        }

        function closeSettings() {
            // Only allow closing if we have a key
            if (apiKey) {
                settingsModal.classList.remove('active');
            } else {
                mainError.textContent = "API key is required to use the app.";
                mainError.style.display = 'block';
            }
        }

        settingsBtn.addEventListener('click', openSettings);
        closeSettingsBtn.addEventListener('click', closeSettings);

        saveKeyBtn.addEventListener('click', () => {
            const newKey = apiKeyInput.value.trim();
            if (newKey) {
                apiKey = newKey;
                localStorage.setItem('openai_api_key', apiKey);
                settingsModal.classList.remove('active');
                mainError.style.display = 'none';
            } else {
                apiKeyInput.classList.add('shake');
                setTimeout(() => apiKeyInput.classList.remove('shake'), 300);
            }
        });

        // Show modal on first load if no key
        if (!apiKey) {
            openSettings();
        }

        // --- Main Screen Logic ---
        platformPills.forEach(pill => {
            pill.addEventListener('click', () => {
                platformPills.forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                currentPlatform = pill.dataset.platform;
            });
        });

        // --- API Call & Loading Logic ---
        const loadingTexts = [
            "Analyzing hook strength...",
            "Measuring emotional triggers...",
            "Calculating virality index...",
            "Generating improvements..."
        ];
        let loadingInterval;
        const loadingTextElement = document.getElementById('loading-text');

        function startLoading() {
            showScreen('loading');
            let textIndex = 0;
            loadingTextElement.textContent = loadingTexts[textIndex];
            loadingInterval = setInterval(() => {
                textIndex = (textIndex + 1) % loadingTexts.length;
                loadingTextElement.textContent = loadingTexts[textIndex];
            }, 1500);
        }

        function stopLoading() {
            clearInterval(loadingInterval);
        }

        async function analyzeContent() {
            const content = postInput.value.trim();

            if (!content) {
                postInput.classList.add('error', 'shake');
                mainError.textContent = "Please enter your content";
                mainError.style.display = 'block';
                setTimeout(() => postInput.classList.remove('shake'), 300);

                postInput.addEventListener('input', function clearError() {
                    postInput.classList.remove('error');
                    mainError.style.display = 'none';
                    postInput.removeEventListener('input', clearError);
                });
                return;
            }

            if (!apiKey) {
                openSettings();
                return;
            }

            mainError.style.display = 'none';
            startLoading();

            const systemPrompt = "You are a viral content expert who analyzes social media posts. Always respond with valid JSON only, no markdown, no explanations outside the JSON.";
            const userPrompt = `You are a viral content expert. Analyze this ${currentPlatform} post for virality potential.

Post: "${content}"

Return ONLY valid JSON (no markdown, no backticks):
{
"viral_score": 0-100,
"hook_strength": 0-100,
"engagement_bait": 0-100,
"curiosity_gap": 0-100,
"emotional_trigger": 0-100,
"call_to_action": 0-100,
"suggestions": ["tip1", "tip2", "tip3"],
"improved_version": "rewritten text here",
"hook_strength_reason": "1 sentence",
"engagement_bait_reason": "1 sentence",
"curiosity_gap_reason": "1 sentence",
"emotional_trigger_reason": "1 sentence",
"call_to_action_reason": "1 sentence"
}`;

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userPrompt }
                        ],
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const data = await response.json();
                let resultText = data.choices[0].message.content.trim();

                // Clean up possible markdown if present despite instructions
                if (resultText.startsWith('```json')) {
                    resultText = resultText.substring(7, resultText.length - 3);
                } else if (resultText.startsWith('```')) {
                    resultText = resultText.substring(3, resultText.length - 3);
                }

                lastAnalysisResult = JSON.parse(resultText);

                stopLoading();
                renderResults(lastAnalysisResult);
                showScreen('results');

                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }

            } catch (err) {
                console.error(err);
                stopLoading();
                showScreen('main');
                mainError.textContent = "Analysis failed. Check your API key and try again.";
                mainError.style.display = 'block';
                openSettings(); // Re-prompt for API key if failed
            }
        }

        analyzeBtn.addEventListener('click', analyzeContent);

        // Navigation
        function showScreen(screenName) {
            Object.values(screens).forEach(screen => {
                if (screen) screen.classList.remove('active');
            });
            if (screens[screenName]) {
                screens[screenName].classList.add('active');
            }

            // Manage MainButton visibility based on screen
            if (tg && tg.MainButton) {
                if (screenName === 'results') {
                    tg.MainButton.text = "✓ Copy Improved Version";
                    tg.MainButton.show();
                } else {
                    tg.MainButton.hide();
                }
            }
        }

        // --- Results Screen Logic ---
        function getScoreColor(score) {
            if (score >= 71) return 'var(--score-high)';
            if (score >= 41) return 'var(--score-medium)';
            return 'var(--score-low)';
        }

        function getScoreLabel(score) {
            if (score >= 71) return '🔥 High potential';
            if (score >= 41) return 'Good potential';
            return 'Low potential';
        }

        function renderResults(data) {
            // 1. Viral Score Gauge
            const viralScoreEl = document.getElementById('viral-score');
            const viralLabelEl = document.getElementById('viral-label');
            const gaugeFill = document.getElementById('gauge-fill');

            const score = data.viral_score;
            const color = getScoreColor(score);

            // Reset for animation
            viralScoreEl.textContent = '0';
            gaugeFill.style.strokeDashoffset = 283;
            gaugeFill.style.stroke = color;
            viralLabelEl.textContent = getScoreLabel(score);
            viralLabelEl.style.color = color;

            // Animate score text and gauge
            setTimeout(() => {
                let currentScore = 0;
                const duration = 1000;
                const startTime = performance.now();

                const updateScore = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    // Ease out cubic
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    currentScore = Math.floor(easeOut * score);
                    viralScoreEl.textContent = currentScore;

                    if (progress < 1) {
                        requestAnimationFrame(updateScore);
                    } else {
                        viralScoreEl.textContent = score;
                    }
                };
                requestAnimationFrame(updateScore);

                // Animate gauge fill (283 is full circle dasharray)
                const offset = 283 - (score / 100) * 283;
                gaugeFill.style.strokeDashoffset = offset;
            }, 100);

            // 2. Breakdown Cards
            const breakdownGrid = document.getElementById('breakdown-grid');
            breakdownGrid.innerHTML = ''; // Clear previous

            const metrics = [
                { id: 'hook', name: '🎯 Hook Strength', val: data.hook_strength, desc: data.hook_strength_reason },
                { id: 'eng', name: '💬 Engagement Bait', val: data.engagement_bait, desc: data.engagement_bait_reason },
                { id: 'cur', name: '🧠 Curiosity Gap', val: data.curiosity_gap, desc: data.curiosity_gap_reason },
                { id: 'emo', name: '😮 Emotional Trigger', val: data.emotional_trigger, desc: data.emotional_trigger_reason },
                { id: 'cta', name: '📢 Call to Action', val: data.call_to_action, desc: data.call_to_action_reason }
            ];

            metrics.forEach((m, index) => {
                const mColor = getScoreColor(m.val);
                const card = document.createElement('div');
                card.className = 'metric-card fade-in-up';
                card.style.animationDelay = `${(index + 1) * 100}ms`;
                card.innerHTML = `
                    <div class="metric-header">
                        <span>${m.name}</span>
                        <span style="color: ${mColor}">${m.val}</span>
                    </div>
                    <div class="metric-bar-bg">
                        <div class="metric-bar-fill" style="background-color: ${mColor}; width: 0%;"></div>
                    </div>
                    <div class="metric-desc">${m.desc}</div>
                `;
                breakdownGrid.appendChild(card);

                // Animate bar fill
                setTimeout(() => {
                    const barFill = card.querySelector('.metric-bar-fill');
                    barFill.style.width = `${m.val}%`;
                }, 100 + (index * 100));
            });

            // 3. Suggestions
            const suggestionsList = document.getElementById('suggestions-list');
            suggestionsList.innerHTML = '';
            (data.suggestions || []).forEach(suggestion => {
                const li = document.createElement('li');
                li.textContent = suggestion;
                suggestionsList.appendChild(li);
            });

            // 4. Improved Version
            const improvedTextEl = document.getElementById('improved-text');
            improvedTextEl.textContent = data.improved_version;

            // Setup Telegram MainButton Copy Action
            if (tg && tg.MainButton) {
                tg.MainButton.offClick(copyImprovedVersion); // Remove previous if any
                tg.MainButton.onClick(copyImprovedVersion);
            }
        }

        // Copy functionality
        function copyImprovedVersion() {
            if (!lastAnalysisResult || !lastAnalysisResult.improved_version) return;

            const textToCopy = lastAnalysisResult.improved_version;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    notifyCopied();
                });
            } else {
                // Fallback
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    notifyCopied();
                } catch (err) {
                    console.error('Fallback copy failed', err);
                }
                document.body.removeChild(textArea);
            }
        }

        function notifyCopied() {
            const copyBtn = document.getElementById('copy-btn');
            const originalHTML = copyBtn.innerHTML;
            copyBtn.innerHTML = `✓ Copied`;
            copyBtn.style.color = 'var(--score-high)';

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }

            setTimeout(() => {
                copyBtn.innerHTML = originalHTML;
                copyBtn.style.color = 'var(--text-main)';
            }, 2000);
        }

        document.getElementById('copy-btn').addEventListener('click', copyImprovedVersion);

        // Analyze Again
        analyzeAgainBtn.addEventListener('click', () => {
            showScreen('main');
        });

        // Share Result
        document.getElementById('share-btn').addEventListener('click', () => {
            if (!lastAnalysisResult) return;

            // Get Bot Username from URL params if available, otherwise fallback
            const urlParams = new URLSearchParams(window.location.search);
            const botUsername = urlParams.get('bot') || 'YOUR_BOT_USERNAME';

            const score = lastAnalysisResult.viral_score;
            const text = `⚡ My post scored ${score}/100 on Viral Score!\n\n🔥 Try it yourself → t.me/${botUsername}`;
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(`t.me/${botUsername}`)}&text=${encodeURIComponent(text)}`;

            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(shareUrl);
            } else {
                window.open(shareUrl, '_blank');
            }
        });

    </script>
</body>
</html>
